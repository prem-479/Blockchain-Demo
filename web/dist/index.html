<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blockchain Demo Prem</title>
  <style>
    /* Blockchain demo: one visual system for every page.
   Validity is expressed ONLY by .block-valid / .block-invalid on a .block panel. */

    :root {
      --page-bg: #fff;
      --text: #333;
      --text-input: #555;
      --well-bg: linear-gradient(to bottom, #e8e8e8 0, #f5f5f5 100%);
      --well-border: #dcdcdc;
      --valid-bg: #dff0d8;
      --valid-border: #d6e9c6;
      --invalid-bg: #f2dede;
      --invalid-border: #ebccd1;
      --input-bg: #fff;
      --input-border: #ccc;
      --addon-bg: #eee;
      --readonly-bg: #eee;
      --focus: #66afe9;
      --btn-top: #337ab7;
      --btn-bottom: #265a88;
      --btn-border: #245580;
      --nav-top: #3c3c3c;
      --nav-bottom: #222;
      --nav-border: #080808;
      --nav-text: #9d9d9d;
      --nav-active-bg: #080808;
      color-scheme: light;

      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --page-bg: #16181a;
        --text: #e2e2e2;
        --text-input: #d2d2d2;
        --well-bg: linear-gradient(to bottom, #2a2d30 0, #232629 100%);
        --well-border: #3a3e42;
        --valid-bg: #22381e;
        --valid-border: #3d6634;
        --invalid-bg: #431f1f;
        --invalid-border: #7a3535;
        --input-bg: #1e2124;
        --input-border: #4a4f55;
        --addon-bg: #2c3034;
        --readonly-bg: #2a2d30;
        --focus: #5aa2dc;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --page-bg: #16181a;
      --text: #e2e2e2;
      --text-input: #d2d2d2;
      --well-bg: linear-gradient(to bottom, #2a2d30 0, #232629 100%);
      --well-border: #3a3e42;
      --valid-bg: #22381e;
      --valid-border: #3d6634;
      --invalid-bg: #431f1f;
      --invalid-border: #7a3535;
      --input-bg: #1e2124;
      --input-border: #4a4f55;
      --addon-bg: #2c3034;
      --readonly-bg: #2a2d30;
      --focus: #5aa2dc;
      color-scheme: dark;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font: 14px/1.42857 "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    /* ---- navigation ---- */
    .navbar {
      background: linear-gradient(to bottom, var(--nav-top) 0, var(--nav-bottom) 100%);
      border-bottom: 1px solid var(--nav-border);
      min-height: 50px;
    }

    .navbar-inner {
      max-width: 1170px;
      margin: 0 auto;
      padding: 0 15px;
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      justify-content: space-between;
    }

    .brand {
      color: var(--nav-text);
      font-size: 18px;
      line-height: 20px;
      padding: 15px 0;
      text-decoration: none;
    }

    .navbar ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
    }

    .navbar li a {
      display: block;
      padding: 15px;
      line-height: 20px;
      color: var(--nav-text);
      text-decoration: none;
    }

    .navbar li a:hover {
      color: #fff;
    }

    .navbar li a[aria-current="page"] {
      background: var(--nav-active-bg);
      color: #fff;
    }

    .navbar a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: -2px;
    }

    /* ---- page frame ---- */
    .page {
      padding: 0 15px 30px;
    }

    .page.narrow {
      max-width: 1170px;
      margin: 0 auto;
    }

    h1 {
      font-size: 36px;
      font-weight: 500;
      line-height: 1.1;
      margin: 20px 0 10px;
    }

    h2.peer {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.1;
      margin: 20px 0 10px;
    }

    /* ---- shared panel ---- */
    .well,
    .block {
      --label-w: 113px;
      border: 1px solid var(--well-border);
      border-radius: 4px;
      padding: 19px;
      margin-bottom: 20px;
    }

    .well {
      background: var(--well-bg);
    }

    .well.wide,
    .block.wide {
      --label-w: 189px;
    }

    .block {
      background: var(--well-bg);
    }

    .block-valid {
      background: var(--valid-bg);
      border-color: var(--valid-border);
    }

    .block-invalid {
      background: var(--invalid-bg);
      border-color: var(--invalid-border);
    }

    .chain-row {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      overflow-x: auto;
      padding-bottom: 15px;
    }

    .chain-row .block {
      flex: 0 0 684px;
      max-width: 100%;
      margin-bottom: 0;
    }

    /* ---- form rows ---- */
    .row {
      display: grid;
      grid-template-columns: var(--label-w) minmax(0, 1fr);
      margin-bottom: 15px;
      align-items: start;
    }

    .row>label,
    .row>.label {
      text-align: right;
      font-weight: 700;
      padding: 7px 15px 0 0;
      margin: 0;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    .control,
    .addon {
      height: 34px;
      padding: 6px 12px;
      font-size: 13px;
      line-height: 1.42857;
      border: 1px solid var(--input-border);
      color: var(--text-input);
      background: var(--input-bg);
      font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
      width: 100%;
      border-radius: 4px;
      box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075);
    }

    textarea.control {
      height: 213px;
      font-size: 14px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      resize: vertical;
      display: block;
    }

    .control:focus {
      outline: 0;
      border-color: var(--focus);
      box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075), 0 0 8px color-mix(in srgb, var(--focus) 60%, transparent);
    }

    .control[readonly] {
      background: var(--readonly-bg);
    }

    .group {
      display: flex;
      min-width: 0;
    }

    .group>* {
      min-width: 0;
    }

    .group .control {
      flex: 1 1 0;
      width: auto;
      border-radius: 0;
      margin-left: -1px;
    }

    .group> :first-child {
      border-top-left-radius: 4px;
      border-bottom-left-radius: 4px;
      margin-left: 0;
    }

    .group> :last-child {
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
    }

    .addon {
      flex: 0 0 auto;
      width: auto;
      background: var(--addon-bg);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      text-align: center;
      margin-left: -1px;
      border-radius: 0;
      box-shadow: none;
    }

    .group>.addon:first-child {
      margin-left: 0;
    }

    .txlist {
      display: grid;
      gap: 0;
    }

    .txlist .group {
      margin-bottom: 0;
    }

    .txlist .group+.group {
      margin-top: 0;
    }

    .txlist .group .control {
      border-radius: 0;
    }

    .txlist .group:first-child> :first-child {
      border-top-left-radius: 4px;
    }

    .txlist .group:first-child> :last-child {
      border-top-right-radius: 4px;
    }

    .txlist .group:last-child> :first-child {
      border-bottom-left-radius: 4px;
    }

    .txlist .group:last-child> :last-child {
      border-bottom-right-radius: 4px;
    }

    .txlist .group+.group>* {
      margin-top: -1px;
    }

    .txlist .group+.group>.addon:first-child,
    .txlist .group+.group>.control:first-child {
      margin-left: 0;
    }

    /* ---- button ---- */
    .btn-mine {
      display: inline-block;
      padding: 6px 12px;
      font-size: 13px;
      line-height: 1.42857;
      color: #fff;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, .2);
      background: linear-gradient(to bottom, var(--btn-top) 0, var(--btn-bottom) 100%);
      border: 1px solid var(--btn-border);
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), 0 1px 1px rgba(0, 0, 0, .075);
      cursor: pointer;
    }

    .btn-mine:hover {
      background: var(--btn-bottom);
      background-position: 0 -15px;
    }

    .btn-mine:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .btn-mine:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    @media (max-width: 767px) {
      .navbar-inner {
        padding: 0 8px;
      }

      .navbar li a {
        padding: 15px 9px;
      }

      .well.wide,
      .block.wide {
        --label-w: 100px;
      }

      .chain-row .block {
        flex-basis: calc(100vw - 30px);
      }
    }
  </style>
</head>

            var ch = (e & f) ^ (~e & g);
            var t1 = (h + S1 + ch + K[i] + W[i]) | 0;
            var S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
            var maj = (a & b) ^ (a & c) ^ (b & c);
            var t2 = (S0 + maj) | 0;
            h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
          }
          h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0;
          h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
        }
        return [h0, h1, h2, h3, h4, h5, h6, h7]
          .map(function (v) { return (v >>> 0).toString(16).padStart(8, '0'); }).join('');
      }

      /* ----------------------------------------------------------- Block model */
      /*
       * A block is a plain object; every field is a STRING exactly as typed
       * (so "25.00" stays "25.00"; it is never re-formatted).
       *   kind     'data' | 'tokens' | 'coinbase'
       *   linked   false only for the standalone Block page (no Prev field)
       *   number, nonce, data, prev, hash
       *   coinbase { amount, to }            (coinbase kind only)
       *   tx       [{ amount, from, to }]    (tokens / coinbase kinds)
       */
      function createBlock(kind, input) {
        input = input || {};
        var b = {
          kind: kind,
          linked: input.linked !== false,
          number: String(input.number === undefined ? '1' : input.number),
          nonce: String(input.nonce === undefined ? '0' : input.nonce),
          data: String(input.data === undefined ? '' : input.data),
          prev: String(input.prev === undefined ? GENESIS_PREV : input.prev),
          hash: '',
          coinbase: kind === KINDS.COINBASE
            ? { amount: String((input.coinbase || {}).amount || '0.00'), to: String((input.coinbase || {}).to || '') }
            : null,
          tx: (input.tx || []).map(function (t) {
            return { amount: String(t.amount), from: String(t.from), to: String(t.to) };
          })
        };
        b.hash = input.hash !== undefined ? String(input.hash) : calculateHash(b);
        return b;
      }

      /* ---------------------------------------------- Canonical serialization */
      /*
       *  data     : number + nonce + data                       [+ prev if linked]
       *  tokens   : number + nonce + SUM(amount+from+to)        [+ prev]
       *  coinbase : number + nonce + cbAmount + cbTo + SUM(amount+from+to) [+ prev]
       * Plain concatenation, no separators, UTF-8, exactly as the reference demo.
       * canonical = head + nonce + tail  (so mining only re-builds the nonce).
       */
      function txString(txs) {
        var s = '';
        for (var i = 0; i < txs.length; i++) s += txs[i].amount + txs[i].from + txs[i].to;
        return s;
      }

      function serializeParts(block) {
        var body;
        if (block.kind === KINDS.TOKENS) body = txString(block.tx);
        else if (block.kind === KINDS.COINBASE) body = block.coinbase.amount + block.coinbase.to + txString(block.tx);
        else body = block.data;
        return { head: String(block.number), tail: body + (block.linked ? block.prev : '') };
      }

      function canonicalBlockData(block) {
        var p = serializeParts(block);
        return p.head + block.nonce + p.tail;
      }

      function calculateHash(block) {
        return sha256(canonicalBlockData(block));
      }

      /* ------------------------------------------------------------ Validation */
      var INT_RE = /^-?\d+$/;
      var NONNEG_INT_RE = /^\d+$/;

      /*
       * The reference demo places no format restriction on amounts: block 5 of the
       * Tokens page uses "2,760.29" (a thousands separator) and hashes fine. So the
       * only structural requirements are on number/nonce (they drive mining and
       * chain position); amount/from/to are free text, exactly what's hashed.
       */
      function structureError(block) {
        if (!INT_RE.test(block.number)) return 'Invalid block number';
        if (!NONNEG_INT_RE.test(block.nonce)) return 'Invalid nonce';
        if (block.kind === KINDS.COINBASE) {
          if (block.coinbase.amount === '' || block.coinbase.to === '') return 'Invalid transaction data';
        }
        if (block.kind === KINDS.TOKENS || block.kind === KINDS.COINBASE) {
          for (var i = 0; i < block.tx.length; i++) {
            var t = block.tx[i];
            if (t.amount === '' || t.from === '' || t.to === '') return 'Invalid transaction data';
          }
        }
        return null;
      }

      /**
       * Local validity of ONE block (conditions A-D + structure).
       * previousBlock === null means "this is the genesis position".
       */
      function validateBlock(block, previousBlock) {
        var calculatedHash = calculateHash(block);
        var hashCorrect = block.hash === calculatedHash;                       // A
        var proofOfWorkValid = calculatedHash.indexOf(REQUIRED_PREFIX) === 0;  // B
        var previousHashValid = true, expectedPreviousHash = null, actualPreviousHash = null, prevReason = null;
        if (block.linked) {                                                    // C / D
          actualPreviousHash = block.prev;
          if (previousBlock) {
            expectedPreviousHash = calculateHash(previousBlock);
            prevReason = 'Previous hash mismatch';
          } else {
            expectedPreviousHash = GENESIS_PREV;
            prevReason = 'Genesis previous hash mismatch';
          }
          previousHashValid = actualPreviousHash === expectedPreviousHash;
        }
        var sErr = structureError(block);
        var reason = null;
        if (sErr) reason = sErr;
        else if (!hashCorrect) reason = 'Hash mismatch';
        else if (!proofOfWorkValid) reason = 'Proof of work not satisfied';
        else if (!previousHashValid) reason = prevReason;
        return {
          valid: reason === null,
          hashCorrect: hashCorrect,
          proofOfWorkValid: proofOfWorkValid,
          previousHashValid: previousHashValid,
          structureValid: sErr === null,
          calculatedHash: calculatedHash,
          expectedPreviousHash: expectedPreviousHash,
          actualPreviousHash: actualPreviousHash,
          reason: reason
        };
      }

      /**
       * Validity of a whole chain. THIS is what every renderer uses for colour.
       * A block is valid only if it is locally valid AND the block before it is valid
       * (an invalid block invalidates everything downstream: acceptance tests 2 and 5).
       */
      function validateBlockchain(blocks) {
        var results = [];
        for (var i = 0; i < blocks.length; i++) {
          var local = validateBlock(blocks[i], i > 0 ? blocks[i - 1] : null);
          var previousBlockValid = i === 0 ? true : results[i - 1].valid;
          var r = {};
          for (var k in local) r[k] = local[k];
          r.locallyValid = local.valid;
          r.previousBlockValid = previousBlockValid;
          r.valid = local.valid && previousBlockValid;
          r.reason = !local.valid ? local.reason : (previousBlockValid ? null : 'Previous block invalid');
          results.push(r);
        }
        return {
          valid: results.every(function (r) { return r.valid; }),
          blocks: results
        };
      }

      /* ---------------------------------------------------------------- Mining */
      /** Try `iterations` nonces starting at `startNonce`. Real proof of work. */
      function mineChunk(block, startNonce, iterations) {
        var p = serializeParts(block);
        var end = startNonce + iterations;
        for (var n = startNonce; n < end; n++) {
          var h = sha256(p.head + n + p.tail);
          if (h.indexOf(REQUIRED_PREFIX) === 0) return { found: true, nonce: n, hash: h, next: n + 1 };
        }
        return { found: false, next: end };
      }

      /** First valid nonce counting up from 0. */
      function findNonce(block) {
        var start = 0;
        for (; ;) {
          var r = mineChunk(block, start, 50000);
          if (r.found) return r;
          start = r.next;
        }
      }

      /* ----------------------------------------------------------------- Chain */
      /** Mutable chain state. The DOM is only ever a view of one of these. */
      function Chain(kind, blockInputs) {
        this.kind = kind;
        this.blocks = blockInputs.map(function (b) { return createBlock(kind, b); });
      }

      Chain.prototype.validate = function () { return validateBlockchain(this.blocks); };

      /** Edit one field by path ('data', 'nonce', 'number', 'prev', 'coinbase.amount', 'tx.2.from', ...). */
      Chain.prototype.setField = function (index, path, value) {
        var b = this.blocks[index];
        var parts = path.split('.');
        if (parts.length === 1) b[parts[0]] = String(value);
        else if (parts[0] === 'coinbase') b.coinbase[parts[1]] = String(value);
        else if (parts[0] === 'tx') b.tx[Number(parts[1])][parts[2]] = String(value);
        else throw new Error('Unknown field ' + path);
        if (parts[0] !== 'hash') b.hash = calculateHash(b);   // hash is always derived, never trusted
      };

      /**
       * Store a mined nonce, then let the NEXT block follow the new hash
       * (its Prev is updated, which changes its own hash, so it stays invalid until mined).
       * Nothing downstream is mined automatically.
       */
      Chain.prototype.applyMined = function (index, nonce) {
        var b = this.blocks[index];
        b.nonce = String(nonce);
        b.hash = calculateHash(b);
        var next = this.blocks[index + 1];
        if (next && next.linked) {
          next.prev = b.hash;
          next.hash = calculateHash(next);
        }
      };

      Chain.prototype.mine = function (index) {
        var r = findNonce(this.blocks[index]);
        this.applyMined(index, r.nonce);
        return r;
      };

      return {
        DIFFICULTY: DIFFICULTY, REQUIRED_PREFIX: REQUIRED_PREFIX, GENESIS_PREV: GENESIS_PREV, KINDS: KINDS,
        sha256: sha256, createBlock: createBlock, serializeParts: serializeParts,
        canonicalBlockData: canonicalBlockData, calculateHash: calculateHash,
        validateBlock: validateBlock, validateBlockchain: validateBlockchain,
        mineChunk: mineChunk, findNonce: findNonce, Chain: Chain
      };
    });

  </script>
  <script>
    /*
     * app.js: the UI is a VIEW of chain state (docs/BLOCKCHAIN_BEHAVIOR.md).
     *
     *   edit / mine  ->  mutate state (Chain)  ->  refresh(): validate -> render -> apply class
     *
     * refresh() is the ONLY place that sets .block-valid / .block-invalid, and it asks the ONE
     * validator (BlockchainCore.validateBlockchain via Chain.validate). No button handler
     * ever "makes a block green".
     */
    (function () {
      'use strict';
      var C = window.BlockchainCore;
      var INITIAL = JSON.parse(document.getElementById('initial-state').textContent);
      var main = document.getElementById('main');
      var uid = 0;

      function clone(x) { return JSON.parse(JSON.stringify(x)); }

      function el(tag, props, children) {
        var n = document.createElement(tag);
        Object.keys(props || {}).forEach(function (k) {
          if (k === 'class') n.className = props[k];
          else if (k === 'text') n.textContent = props[k];
          else n.setAttribute(k, props[k]);
        });
        (children || []).forEach(function (c) { n.appendChild(c); });
        return n;
      }

      function getPath(b, path) {
        var p = path.split('.');
        if (p.length === 1) return b[p[0]];
        if (p[0] === 'coinbase') return b.coinbase[p[1]];
        return b.tx[Number(p[1])][p[2]];
      }

      /* ------------------------------------------------------------ chain view */
      function createChainView(kind, initialBlocks, opts) {
        var chain = new C.Chain(kind, clone(initialBlocks));
        var id = 'c' + (++uid);
        var root = el('div', { class: opts.single ? '' : 'chain-row' });
        var ctx = { chain: chain, id: id, blocks: [], mineToken: [] };

        function input(path, i, extra) {
          var a = {
            class: 'control', type: 'text', id: id + '-' + i + '-' + path.replace(/\./g, '-'),
            autocomplete: 'off', spellcheck: 'false', autocapitalize: 'off', 'data-path': path
          };
          Object.keys(extra || {}).forEach(function (k) { a[k] = extra[k]; });
          return el('input', a);
        }
        function addon(text) { return el('span', { class: 'addon', text: text }); }
        function row(label, forId, control) {
          return el('div', { class: 'row' }, [
            forId ? el('label', { for: forId, text: label }) : el('span', { class: 'label', text: label }),
            control
          ]);
        }

        chain.blocks.forEach(function (blk, i) {
          var panel = el('div', { class: 'block' + (opts.single ? ' wide' : ''), role: 'group', 'data-index': String(i) });
          var fields = [];                                    // {node, path}
          var bind = function (node, path) { fields.push({ node: node, path: path }); return node; };

          var num = bind(input('number', i), 'number');
          panel.appendChild(row('Block:', num.id, el('div', { class: 'group' }, [addon('#'), num])));
          var nonce = bind(input('nonce', i), 'nonce');
          panel.appendChild(row('Nonce:', nonce.id, nonce));

          if (kind === 'data') {
            var ta = bind(el('textarea', {
              class: 'control', id: id + '-' + i + '-data', 'data-path': 'data',
              spellcheck: 'false'
            }), 'data');
            panel.appendChild(row('Data:', ta.id, ta));
          }
          if (kind === 'coinbase') {
            var ca = bind(input('coinbase.amount', i, { 'aria-label': 'Coinbase amount' }), 'coinbase.amount');
            var ct = bind(input('coinbase.to', i, { 'aria-label': 'Coinbase recipient' }), 'coinbase.to');
            panel.appendChild(row('Coinbase:', ca.id, el('div', { class: 'group' }, [addon('$'), ca, addon('->'), ct])));
          }
          if (kind === 'tokens' || kind === 'coinbase') {
            var list = el('div', { class: 'txlist' });
            blk.tx.forEach(function (_, t) {
              var n = t + 1;
              var amt = bind(input('tx.' + t + '.amount', i, { 'aria-label': 'Transaction ' + n + ' amount' }), 'tx.' + t + '.amount');
              var frm = bind(input('tx.' + t + '.from', i, { 'aria-label': 'Transaction ' + n + ' sender' }), 'tx.' + t + '.from');
              var to = bind(input('tx.' + t + '.to', i, { 'aria-label': 'Transaction ' + n + ' recipient' }), 'tx.' + t + '.to');
              list.appendChild(el('div', { class: 'group' }, [addon('$'), amt, addon('From:'), frm, addon('->'), to]));
            });
            panel.appendChild(row('Tx:', null, list));
          }
          if (blk.linked) {
            var prev = bind(input('prev', i), 'prev');
            panel.appendChild(row('Prev:', prev.id, prev));
          }
          var hash = el('input', { class: 'control', type: 'text', readonly: 'readonly', id: id + '-' + i + '-hash' });
          panel.appendChild(row('Hash:', hash.id, hash));
          var btn = el('button', { class: 'btn-mine', type: 'button', text: 'Mine' });
          panel.appendChild(row('', null, el('div', {}, [btn])));

          ctx.blocks.push({ panel: panel, fields: fields, hash: hash, button: btn });
          ctx.mineToken.push(0);
          root.appendChild(panel);
        });

        /* edits: mutate state -> recalculate hash (inside setField) -> refresh */
        root.addEventListener('input', function (e) {
          var t = e.target;
          var path = t.getAttribute && t.getAttribute('data-path');
          if (!path) return;
          var i = Number(t.closest('.block').getAttribute('data-index'));
          ctx.mineToken[i]++;                                 // an edit cancels a mining run in progress
          chain.setField(i, path, t.value);
          refresh(ctx);
        });

        /* Mine: real proof of work from nonce 0; then update state; then refresh() decides the colour */
        root.addEventListener('click', function (e) {
          var btn = e.target.closest && e.target.closest('.btn-mine');
          if (!btn || btn.disabled) return;
          mine(ctx, Number(btn.closest('.block').getAttribute('data-index')));
        });

        refresh(ctx);
        return { root: root, ctx: ctx };
      }

      /** Render state -> DOM, then colour from the central validator. Nothing else may touch the classes. */
      function refresh(ctx) {
        var validation = ctx.chain.validate();
        ctx.chain.blocks.forEach(function (b, i) {
          var v = ctx.blocks[i];
          v.fields.forEach(function (f) {
            var value = getPath(b, f.path);
            if (f.node.value !== value) f.node.value = value;
          });
          if (v.hash.value !== b.hash) v.hash.value = b.hash;
          var valid = validation.blocks[i].valid;
          v.panel.classList.toggle('block-valid', valid);
          v.panel.classList.toggle('block-invalid', !valid);
          v.panel.setAttribute('aria-label', 'Block ' + b.number + (valid ? ', valid' : ', invalid'));
        });
      }

      /** Chunked so the page stays responsive; every hash is a genuine attempt (no sleeping, no shortcuts). */
      function mine(ctx, i) {
        var v = ctx.blocks[i];
        var block = ctx.chain.blocks[i];
        var token = ++ctx.mineToken[i];
        var nonce = 0;
        v.button.disabled = true;
        (function step() {
          if (ctx.mineToken[i] !== token) { v.button.disabled = false; return; }   // edited meanwhile: abandon
          var t0 = performance.now(), r;
          do {
            r = C.mineChunk(block, nonce, 1000);
            nonce = r.next;
          } while (!r.found && performance.now() - t0 < 25);
          if (r.found) {
            ctx.chain.applyMined(i, r.nonce);
            v.button.disabled = false;
            refresh(ctx);
            return;
          }
          setTimeout(step, 0);
        })();
      }

      /* ------------------------------------------------------------ hash page */
      function buildHashPage() {
        var ta = el('textarea', { class: 'control', id: 'hash-data', spellcheck: 'false' });
        var out = el('input', { class: 'control', type: 'text', readonly: 'readonly', id: 'hash-out' });
        function update() { out.value = C.sha256(ta.value); }
        ta.addEventListener('input', update);
        update();
        var well = el('div', { class: 'well wide' }, [
          el('div', { class: 'row' }, [el('label', { for: 'hash-data', text: 'Data:' }), ta]),
          el('div', { class: 'row' }, [el('label', { for: 'hash-out', text: 'Hash:' }), out])
        ]);
        return { title: 'SHA256 Hash', narrow: true, nodes: [well] };
      }

      /* ---------------------------------------------------------------- pages */
      function buildBlockPage() {
        var view = createChainView('data', INITIAL.block, { single: true });
        return { title: 'Block', narrow: true, nodes: [view.root] };
      }
      function buildSingleChainPage(title, kind, key) {
        var view = createChainView(kind, INITIAL[key], {});
        return { title: title, narrow: false, nodes: [view.root] };
      }
      function buildPeerPage(title, kind, key) {
        var nodes = [];
        ['A', 'B', 'C'].forEach(function (name) {       // each peer owns an independent copy of the state
          nodes.push(el('h2', { class: 'peer', text: 'Peer ' + name }));
          nodes.push(createChainView(kind, INITIAL[key], {}).root);
        });
        return { title: title, narrow: false, nodes: nodes };
      }

      var builders = {
        hash: buildHashPage,
        block: buildBlockPage,
        blockchain: function () { return buildSingleChainPage('Blockchain', 'data', 'blockchain'); },
        distributed: function () { return buildPeerPage('Distributed Blockchain', 'data', 'distributed'); },
        tokens: function () { return buildPeerPage('Tokens', 'tokens', 'tokens'); },
        coinbase: function () { return buildPeerPage('Coinbase Transactions', 'coinbase', 'coinbase'); }
      };
      var built = {};

      function route() {
        var key = (location.hash.replace(/^#\/?/, '') || 'hash');
        if (!builders[key]) key = 'hash';
        if (!built[key]) {
          var page = builders[key]();
          var section = el('div', { class: 'page' + (page.narrow ? ' narrow' : '') }, [el('h1', { text: page.title })]);
          page.nodes.forEach(function (n) { section.appendChild(n); });
          built[key] = section;
        }
        main.replaceChildren(built[key]);
        document.querySelectorAll('.navbar li a').forEach(function (a) {
          if (a.getAttribute('href') === '#/' + key) a.setAttribute('aria-current', 'page');
          else a.removeAttribute('aria-current');
        });
      }

      window.addEventListener('hashchange', route);
      route();
    })();

  </script>
</body>
